<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Anamnese | Cami tattoo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 28px 22px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 28px;
      color: #666;
      font-size: 14px;
    }

    h2 {
      font-size: 18px;
      margin-top: 28px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .checkbox {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 15px;
      font-weight: normal;
      line-height: 1.4;
    }

    .checkbox input {
      width: auto;
      margin-top: 3px;
    }

    .button {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.9;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Cami tattoo</h1>
  <div class="subtitle">Ficha de Anamnese para Tatuagem</div>

  <form>

    <h2>Dados pessoais</h2>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" required>

    <label for="telefone">Telefone</label>
    <input type="tel" id="telefone" name="telefone" required>

    <label for="data_nascimento">Data de nascimento</label>
    <input type="date" id="data_nascimento" name="data_nascimento">

    <h2>Informações importantes</h2>

    <label for="medicamentos">
      Faz uso de algum medicamento?
    </label>
    <textarea id="medicamentos" name="medicamentos"
      placeholder="Informe o nome do medicamento, se houver."></textarea>

    <label for="alergias">
      Possui alguma alergia?
    </label>
    <textarea id="alergias" name="alergias"
      placeholder="Informe quais, se houver."></textarea>

    <label for="reacoes">
      Já teve alguma reação a produtos, cosméticos, tintas ou materiais?
    </label>
    <textarea id="reacoes" name="reacoes"
      placeholder="Descreva, se houver."></textarea>

    <label for="observacoes">
      Existe alguma outra informação que você considera importante comunicar antes da tatuagem?
    </label>
    <textarea id="observacoes" name="observacoes"></textarea>

    <h2>Autorização de imagem</h2>

    <label class="checkbox">
      <input type="checkbox" name="autorizacao_imagem">
      <span>
        Autorizo a Cami tattoo a fotografar e/ou filmar minha tatuagem
        e utilizar essas imagens para divulgação do trabalho em redes
        sociais e materiais relacionados ao trabalho, por prazo indeterminado.
      </span>
    </label>

    <h2>Declaração</h2>

    <label class="checkbox">
      <input type="checkbox" name="declaracao" required>
      <span>
        Declaro que as informações fornecidas nesta ficha são verdadeiras
        e estou ciente de que devo informar qualquer alteração ou condição
        relevante antes da realização da tatuagem.
      </span>
    </label>

    <button type="submit" class="button">
      Enviar ficha
    </button>

    <div class="notice">
      Seus dados devem ser tratados de forma privada e utilizados
      exclusivamente para os fins relacionados ao atendimento.
    </div>

  </form>

</div>

</body>
</html>
